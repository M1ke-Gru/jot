[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Mike", email = "2023postline@proton.me" }]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-ninja>=1.7.0",
    "pydantic[email]>=2.13.5",
]

[tool.uv]
package = false

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.1",
]
