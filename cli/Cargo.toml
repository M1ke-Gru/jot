[package]
name = "jot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = { version = "0.12.0", features = ["password"] }
json = "0.12.4"
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["json", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
[dependencies.uuid]
version = "1"
features = ["serde"]
